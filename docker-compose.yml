services:
  neo4j:
    image: neo4j:5
    container_name: gdpr-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser (http)
      - "7687:7687"   # Bolt (driver connections)
    environment:
      # Auth must match NEO4J_USER / NEO4J_PASSWORD in .env
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: gdpr-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Reach Neo4j over the compose network (overrides .env's localhost).
      NEO4J_URI: bolt://neo4j:7687
    volumes:
      # Mount the prebuilt vector index (rebuild locally with src/rag/ingest.py).
      # Not read-only: ChromaDB's SQLite backend opens the database read-write
      # even for queries (locks / WAL), so a :ro mount fails at startup.
      - ./chroma_db:/app/chroma_db
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
